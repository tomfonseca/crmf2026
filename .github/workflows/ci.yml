name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  dashboard-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: pnpm --dir web test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-browser-results
          path: web/test-results/
          retention-days: 7
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.8"
      - run: pnpm --dir web install --frozen-lockfile
      - run: make gen
      - run: git diff --exit-code -- internal web/packages/api-client/src
      - run: make lint test build agent
      - run: make integration
      - name: Capture synthetic auth mail locally
        run: |
          python scripts/tasks.py mail-dev
          MAILPIT_TEST_URL=http://localhost:18025 go test -tags=integration ./internal/server/auth -run '^Test(AuthMailCapture|PasswordResetKernelMailpitRoundTrip|RecoveryQueueMailpitRoundTrip)$' -count=1
          MAILPIT_TEST_URL=http://localhost:18025 go test -tags=integration ./internal/server/httpapi -run '^TestHTTPSRecoveryRequestMailpitAndSamePasskey$' -count=1
      - run: make security
      - run: docker build -f deploy/Dockerfile -t crmf-server:ci .
      - run: docker build -f deploy/vps/Dockerfile.web -t crmf-web-edge:ci .
      - name: Test production web edge on loopback
        env:
          CRMF_EDGE_IMAGE: crmf-web-edge:ci
          QG_SITE: http://qg.crmfarma.app.br
          DASH_SITE: http://dash.crmfarma.app.br
          API_SITE: http://api.crmfarma.app.br
        run: |
          docker compose -p crmf-web-edge-ci -f deploy/vps/compose.web.yaml up -d --wait --wait-timeout 30
          CRMF_WEB_EDGE_URL=http://127.0.0.1:18081 python -m unittest discover -s tests -p test_web_edge.py -v
      - if: always()
        name: Stop web-edge test container
        env:
          CRMF_EDGE_IMAGE: crmf-web-edge:ci
        run: |
          docker compose -p crmf-web-edge-ci -f deploy/vps/compose.web.yaml logs --tail=30
          docker compose -p crmf-web-edge-ci -f deploy/vps/compose.web.yaml down
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: crmf-server:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: crmf-web-edge:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - if: always()
        run: docker compose -f compose.yaml -f compose.mail.yaml logs --tail=50
      - if: always()
        run: docker compose -f compose.yaml -f compose.mail.yaml down
