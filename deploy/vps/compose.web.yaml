name: crmf-hml-web
services:
  edge:
    image: ${CRMF_EDGE_IMAGE:?Use an immutable release tag or image digest}
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 100
    mem_limit: 192m
    cpus: 0.75
    environment:
      QG_SITE: ${QG_SITE:-https://qg.crmfarma.app.br}
      DASH_SITE: ${DASH_SITE:-https://dash.crmfarma.app.br}
      API_SITE: ${API_SITE:-https://api.crmfarma.app.br}
    ports:
      - "${EDGE_BIND_ADDRESS:-127.0.0.1}:${EDGE_HTTP_PORT:-18081}:80"
      - "${EDGE_BIND_ADDRESS:-127.0.0.1}:${EDGE_HTTPS_PORT:-18443}:443"
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
