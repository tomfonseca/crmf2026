openapi: 3.1.0
info:
  title: CRMF Ingestion API
  version: 0.0.0
  description: M0 foundation. Device authentication and ingestion endpoints arrive in M3.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: healthz
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
components:
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ok]}
