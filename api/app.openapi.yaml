openapi: 3.1.0
info:
  title: CRMF Application API
  version: 0.0.0
  description: M0 health probes and M1 own authentication. Authentication requires explicit secure configuration; no public registration or ERP queries.
servers:
  - url: http://localhost:8080
paths:
  /v1/me/password:
    post:
      operationId: changePasswordTenant
      security: [{TenantSession: []}]
      description: Current password required. Atomically revoke all sessions and challenges; preserve passkeys. No email reset.
      parameters: [{$ref: '#/components/parameters/CRMFRequest'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordChangeInput'}
      responses:
        '204':
          description: Password changed; all sessions revoked and browser cookies cleared
        default:
          description: Request rejected or service unavailable
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/me/sessions:
    get:
      operationId: listSessionsTenant
      security: [{TenantSession: []}]
      description: Own live sessions in this realm only, at most 100. IDs are references, never authentication tokens.
      parameters:
        - name: after
          in: query
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Live session metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionPage'}
        default:
          description: Request rejected or service unavailable
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
    delete:
      operationId: endSessionTenant
      security: [{TenantSession: []}]
      parameters: [{$ref: '#/components/parameters/CRMFRequest'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EndSessionInput'}
      responses:
        '204':
          description: Own session revoked (idempotent); cookies cleared if current
        default:
          description: Request rejected or service unavailable
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/hq/me/password:
    post:
      operationId: changePasswordPlatform
      security: [{PlatformSession: []}]
      description: Current password required. Atomically revoke all sessions and challenges; preserve passkeys. No email reset.
      parameters: [{$ref: '#/components/parameters/CRMFRequest'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordChangeInput'}
      responses:
        '204':
          description: Password changed; all sessions revoked and browser cookies cleared
        default:
          description: Request rejected or service unavailable
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/hq/me/sessions:
    get:
      operationId: listSessionsPlatform
      security: [{PlatformSession: []}]
      description: Own live sessions in this realm only, at most 100. IDs are references, never authentication tokens.
      parameters:
        - name: after
          in: query
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Live session metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionPage'}
        default:
          description: Request rejected or service unavailable
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
    delete:
      operationId: endSessionPlatform
      security: [{PlatformSession: []}]
      parameters: [{$ref: '#/components/parameters/CRMFRequest'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EndSessionInput'}
      responses:
        '204':
          description: Own session revoked (idempotent); cookies cleared if current
        default:
          description: Request rejected or service unavailable
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /healthz:
    get:
      operationId: healthz
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /readyz:
    get:
      operationId: readyz
      responses:
        '200':
          description: Control database, analytics database and Blob Storage are reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: A required dependency is unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/auth/login:
    post:
      operationId: loginTenant
      security: []
      parameters:
        - $ref: '#/components/parameters/CRMFRequest'
      description: Realm-bound authentication; mutations require the allowed Origin and X-CRMF-Request header.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginInput'}
      responses:
        '200':
          description: Authentication result; opaque tokens are only returned as secure HttpOnly cookies
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthOutcome'}
        default:
          description: Request rejected or authentication unavailable
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/auth/passkey:
    post:
      operationId: passkeyTenant
      security:
        - TenantChallenge: []
      parameters:
        - $ref: '#/components/parameters/CRMFRequest'
      description: Realm-bound authentication; mutations require the allowed Origin and X-CRMF-Request header.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasskeyInput'}
      responses:
        '200':
          description: Authentication result; opaque tokens are only returned as secure HttpOnly cookies
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthOutcome'}
        default:
          description: Request rejected or authentication unavailable
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/auth/logout:
    post:
      operationId: logoutTenant
      security:
        - TenantSession: []
        - {}
      parameters:
        - $ref: '#/components/parameters/CRMFRequest'
      description: Realm-bound authentication; mutations require the allowed Origin and X-CRMF-Request header.
      responses:
        '204':
          description: Cookies cleared and presented session/challenge revoked
        default:
          description: Request rejected or authentication unavailable
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/me/passkey:
    post:
      operationId: enrollTenant
      security:
        - TenantSession: []
      parameters:
        - $ref: '#/components/parameters/CRMFRequest'
      description: Realm-bound authentication; mutations require the allowed Origin and X-CRMF-Request header.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnrollmentInput'}
      responses:
        '200':
          description: Authentication result; opaque tokens are only returned as secure HttpOnly cookies
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthOutcome'}
        default:
          description: Request rejected or authentication unavailable
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/me:
    get:
      operationId: meTenant
      security:
        - TenantSession: []
      description: Realm-bound authentication; mutations require the allowed Origin and X-CRMF-Request header.
      responses:
        '200':
          description: Authentication result; opaque tokens are only returned as secure HttpOnly cookies
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Identity'}
        default:
          description: Request rejected or authentication unavailable
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/hq/auth/login:
    post:
      operationId: loginPlatform
      security: []
      parameters:
        - $ref: '#/components/parameters/CRMFRequest'
      description: Realm-bound authentication; mutations require the allowed Origin and X-CRMF-Request header.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginInput'}
      responses:
        '200':
          description: Authentication result; opaque tokens are only returned as secure HttpOnly cookies
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthOutcome'}
        default:
          description: Request rejected or authentication unavailable
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/hq/auth/passkey:
    post:
      operationId: passkeyPlatform
      security:
        - PlatformChallenge: []
      parameters:
        - $ref: '#/components/parameters/CRMFRequest'
      description: Realm-bound authentication; mutations require the allowed Origin and X-CRMF-Request header.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasskeyInput'}
      responses:
        '200':
          description: Authentication result; opaque tokens are only returned as secure HttpOnly cookies
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthOutcome'}
        default:
          description: Request rejected or authentication unavailable
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/hq/auth/logout:
    post:
      operationId: logoutPlatform
      security:
        - PlatformSession: []
        - {}
      parameters:
        - $ref: '#/components/parameters/CRMFRequest'
      description: Realm-bound authentication; mutations require the allowed Origin and X-CRMF-Request header.
      responses:
        '204':
          description: Cookies cleared and presented session/challenge revoked
        default:
          description: Request rejected or authentication unavailable
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/hq/me/passkey:
    post:
      operationId: enrollPlatform
      security:
        - PlatformSession: []
      parameters:
        - $ref: '#/components/parameters/CRMFRequest'
      description: Realm-bound authentication; mutations require the allowed Origin and X-CRMF-Request header.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnrollmentInput'}
      responses:
        '200':
          description: Authentication result; opaque tokens are only returned as secure HttpOnly cookies
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthOutcome'}
        default:
          description: Request rejected or authentication unavailable
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/hq/me:
    get:
      operationId: mePlatform
      security:
        - PlatformSession: []
      description: Realm-bound authentication; mutations require the allowed Origin and X-CRMF-Request header.
      responses:
        '200':
          description: Authentication result; opaque tokens are only returned as secure HttpOnly cookies
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Identity'}
        default:
          description: Request rejected or authentication unavailable
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/hq/plans:
    get:
      operationId: listPlans
      security: [{PlatformSession: []}]
      parameters:
        - {in: query, name: after, schema: {type: string, maxLength: 64}}
      responses:
        '200':
          description: Up to 100 plans in stable code order; support is read-only
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Plan'}}
                  next_cursor: {type: string}
        default: {$ref: '#/components/responses/CatalogError'}
    post:
      operationId: createPlan
      security: [{PlatformSession: []}]
      parameters: [{$ref: '#/components/parameters/CRMFRequest'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlanInput'}
      responses:
        '201':
          description: Plan persisted and audited; platform_admin only
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Plan'}
        default: {$ref: '#/components/responses/CatalogError'}
  /v1/hq/plans/{id}:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    put:
      operationId: updatePlan
      security: [{PlatformSession: []}]
      parameters: [{$ref: '#/components/parameters/CRMFRequest'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlanUpdate'}
      responses:
        '200':
          description: Plan updated and audited; stale version is rejected with 409
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Plan'}
        default: {$ref: '#/components/responses/CatalogError'}
    delete:
      operationId: deletePlan
      security: [{PlatformSession: []}]
      parameters: [{$ref: '#/components/parameters/CRMFRequest'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, confirmation]
              properties:
                version: {type: integer, format: int32, minimum: 1}
                confirmation: {type: string, description: Exact plan code}
      responses:
        '204': {description: Unsubscribed plan deleted and audited}
        default: {$ref: '#/components/responses/CatalogError'}
  /v1/hq/tenants:
    get:
      operationId: listNetworks
      security: [{PlatformSession: []}]
      parameters:
        - {name: after, in: query, schema: {type: string}}
      responses:
        '200':
          description: Bounded network page with confirmed provisioning status
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Network'}}
                  next_cursor: {type: string}
        default: {$ref: '#/components/responses/NetworkProblem'}
    post:
      operationId: createNetwork
      security: [{PlatformSession: []}]
      parameters: [{$ref: '#/components/parameters/CRMFRequest'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NetworkInput'}
      responses:
        '202':
          description: Reserved network and durable job, or exact existing request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Network'}
        default: {$ref: '#/components/responses/NetworkProblem'}
  /v1/hq/tenants/{id}/retry:
    post:
      operationId: retryNetwork
      security: [{PlatformSession: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/CRMFRequest'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [generation]
              properties:
                generation: {type: integer, format: int32, minimum: 1}
      responses:
        '202':
          description: A new attempt for the same network, never a second tenant
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Network'}
        default: {$ref: '#/components/responses/NetworkProblem'}
  /v1/hq/stores:
    get:
      operationId: listHQStores
      security: [{PlatformSession: []}]
      parameters:
        - {name: after, in: query, schema: {type: string, format: uuid}}
        - {name: tenant_id, in: query, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Bounded configuration catalog; no telemetry claims
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/HQStore'}}
                  next_cursor: {type: string, format: uuid}
        default: {$ref: '#/components/responses/CatalogError'}
    post:
      operationId: createHQStore
      security: [{PlatformSession: []}]
      parameters: [{$ref: '#/components/parameters/CRMFRequest'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HQStoreInput'}
      responses:
        '201':
          description: Store reserved within locked live plan quota and audited
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HQStore'}
        default: {$ref: '#/components/responses/CatalogError'}
  /v1/hq/stores/{id}:
    get:
      operationId: getHQStore
      security: [{PlatformSession: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Checked store identity and configuration
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HQStore'}
        default: {$ref: '#/components/responses/CatalogError'}
    put:
      operationId: updateHQStore
      security: [{PlatformSession: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/CRMFRequest'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HQStoreUpdate'}
      responses:
        '200':
          description: Configuration updated with checked revision; identity cannot move network
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HQStore'}
        default: {$ref: '#/components/responses/CatalogError'}
  /v1/hq/stores/{id}/pairing:
    get:
      operationId: getHQPairing
      security: [{PlatformSession: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Latest code metadata only, never the code or digest. Empty object means no issued code.
          content:
            application/json:
              schema:
                type: object
                properties:
                  current: {$ref: '#/components/schemas/PairingMetadata'}
        default: {$ref: '#/components/responses/CatalogError'}
    post:
      operationId: issueHQPairing
      security: [{PlatformSession: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/CRMFRequest'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [store_version, previous_id]
              properties:
                store_version: {type: integer, format: int32, minimum: 1}
                previous_id: {type: string, description: Latest code UUID or empty string for none. Compare-and-swap, not idempotency.}
      responses:
        '201':
          description: Code shown once, valid 72 hours; five issues per operator/minute and one per store/minute. No M3 redemption endpoint implied.
          content:
            application/json:
              schema:
                type: object
                required: [current, code]
                properties:
                  current: {$ref: '#/components/schemas/PairingMetadata'}
                  code: {type: string, pattern: '^[A-HJ-NP-Z2-9]{8}$'}
        default: {$ref: '#/components/responses/CatalogError'}
  /v1/hq/stores/{id}/pairing/{pairing_id}:
    delete:
      operationId: revokeHQPairing
      security: [{PlatformSession: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: pairing_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/CRMFRequest'}
      responses:
        '204': {description: Unused code revoked and audited, not a device revocation}
        default: {$ref: '#/components/responses/CatalogError'}
  /v1/hq/companies/{cnpj}:
    get:
      operationId: lookupCompany
      security: [{PlatformSession: []}]
      parameters:
        - {name: cnpj, in: path, required: true, schema: {type: string, pattern: '^[A-Z0-9]{12}[0-9]{2}$'}}
      responses:
        '200':
          description: Public company suggestions only; not fiscal verification
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NetworkProfileInput'}
        default: {$ref: '#/components/responses/NetworkProblem'}
  /v1/hq/tenants/{id}/profile:
    put:
      operationId: updateNetworkProfile
      security: [{PlatformSession: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/CRMFRequest'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NetworkProfile'}
      responses:
        '200':
          description: Commercial metadata saved and audited
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NetworkProfile'}
        default: {$ref: '#/components/responses/NetworkProblem'}
components:
  responses:
    NetworkProblem:
      description: Network request rejected or unavailable
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    CatalogError:
      description: Invalid input (400), unauthenticated (401), forbidden (403), missing (404), stale/duplicate/in-use (409) or unavailable (503)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  parameters:
    CRMFRequest:
      in: header
      name: X-CRMF-Request
      required: true
      schema: {type: string, enum: ['1']}
  securitySchemes:
    TenantSession: {type: apiKey, in: cookie, name: __Host-crmf_tenant}
    PlatformSession: {type: apiKey, in: cookie, name: __Host-crmf_platform}
    TenantChallenge: {type: apiKey, in: cookie, name: __Host-crmf_tenant_challenge}
    PlatformChallenge: {type: apiKey, in: cookie, name: __Host-crmf_platform_challenge}
  schemas:
    PasswordChangeInput:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password: {type: string, minLength: 1, maxLength: 1024}
        new_password: {type: string, minLength: 12, maxLength: 1024}
    EndSessionInput:
      type: object
      additionalProperties: false
      required: [session_id]
      properties:
        session_id: {type: string, format: uuid}
    OwnSession:
      type: object
      additionalProperties: false
      required: [id, created_at, last_seen_at, idle_expires_at, expires_at, current, mfa_verified]
      properties:
        id: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}
        idle_expires_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        current: {type: boolean}
        mfa_verified: {type: boolean}
    SessionPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/OwnSession'}
        next_cursor: {type: string, format: uuid}
    PairingMetadata:
      type: object
      required: [id, store_id, status, expires_at]
      properties:
        id: {type: string, format: uuid}
        store_id: {type: string, format: uuid}
        status: {type: string, enum: [pending, used, revoked, expired, invalidated]}
        expires_at: {type: string, format: date-time}
    HQStoreFields:
      type: object
      required: [code, name, city, uf, timezone, erp, status]
      properties:
        code: {type: string, minLength: 1, maxLength: 64}
        name: {type: string, minLength: 1, maxLength: 200}
        city: {type: string, maxLength: 200}
        uf: {type: string, maxLength: 2}
        timezone: {type: string, minLength: 1, maxLength: 200}
        erp: {type: string, enum: [linx_big]}
        status: {type: string, enum: [active, inactive]}
    HQStoreInput:
      allOf:
        - {$ref: '#/components/schemas/HQStoreFields'}
        - type: object
          required: [tenant_id]
          properties:
            tenant_id: {type: string, format: uuid}
    HQStoreUpdate:
      allOf:
        - {$ref: '#/components/schemas/HQStoreFields'}
        - type: object
          required: [version]
          properties:
            version: {type: integer, format: int32, minimum: 1}
    HQStore:
      allOf:
        - {$ref: '#/components/schemas/HQStoreFields'}
        - type: object
          required: [id, tenant_id, network_name, network_slug, version]
          properties:
            id: {type: string, format: uuid}
            tenant_id: {type: string, format: uuid}
            network_name: {type: string}
            network_slug: {type: string}
            version: {type: integer, format: int32, minimum: 1}
    NetworkProfileInput:
      type: object
      additionalProperties: false
      required: [display_name, registered_name, city, uf, contact_name, contact_email, default_timezone, billing_customer_id]
      properties:
        display_name: {type: string, maxLength: 200}
        registered_name: {type: string, maxLength: 200}
        city: {type: string, maxLength: 200}
        uf: {type: string, maxLength: 2}
        contact_name: {type: string, maxLength: 200}
        contact_email: {type: string, maxLength: 200}
        default_timezone: {type: string, maxLength: 200}
        billing_customer_id: {type: string, maxLength: 200}
    NetworkProfile:
      type: object
      additionalProperties: false
      required: [data, version]
      properties:
        data: {$ref: '#/components/schemas/NetworkProfileInput'}
        version: {type: integer, format: int32, minimum: 0}
    NetworkInput:
      type: object
      additionalProperties: false
      required: [slug, legal_name, cnpj, plan_id]
      properties:
        slug: {type: string, pattern: '^[a-z0-9_]{3,40}$'}
        legal_name: {type: string, minLength: 1, maxLength: 200}
        cnpj: {type: string, pattern: '^[A-Z0-9]{12}[0-9]{2}$'}
        plan_id: {type: string, format: uuid}
        profile: {$ref: '#/components/schemas/NetworkProfileInput'}
    Network:
      type: object
      required: [id, slug, legal_name, cnpj, plan_id, plan_name, status, provision_status, schema_version, generation]
      properties:
        id: {type: string, format: uuid}
        slug: {type: string}
        legal_name: {type: string}
        cnpj: {type: string}
        plan_id: {type: string, format: uuid}
        plan_name: {type: string}
        status: {type: string, enum: [trial, active, suspended, cancelled]}
        provision_status: {type: string, enum: [queued, preparing, ready, failed]}
        schema_version: {type: integer, format: int64, minimum: 0}
        generation: {type: integer, format: int32, minimum: 0}
        profile: {$ref: '#/components/schemas/NetworkProfile'}
    PlanFields:
      type: object
      required: [name, price_cents, active, sync_interval_seconds, history_months, max_stores, max_users, modules]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        price_cents: {type: integer, format: int32, minimum: 0}
        active: {type: boolean}
        sync_interval_seconds: {type: integer, format: int32, minimum: 1}
        history_months: {type: integer, format: int32, minimum: 1}
        max_stores: {type: [integer, 'null'], format: int32, minimum: 1}
        max_users: {type: [integer, 'null'], format: int32, minimum: 1}
        modules:
          type: array
          uniqueItems: true
          items: {type: string, enum: [core, realtime, export, pulse]}
    PlanInput:
      allOf:
        - {$ref: '#/components/schemas/PlanFields'}
        - type: object
          description: Omit code to assign an immutable server-generated identifier. Explicit lowercase codes remain supported for compatibility.
          properties:
            code: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'}
    PlanUpdate:
      allOf:
        - {$ref: '#/components/schemas/PlanFields'}
        - type: object
          required: [version]
          properties:
            version: {type: integer, format: int32, minimum: 1}
    Plan:
      allOf:
        - {$ref: '#/components/schemas/PlanInput'}
        - type: object
          required: [id, version, code]
          properties:
            id: {type: string, format: uuid}
            version: {type: integer, format: int32, minimum: 1}
    LoginInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, minLength: 1, maxLength: 320}
        password: {type: string, minLength: 1, maxLength: 1024}
    PasskeyInput:
      type: object
      additionalProperties: false
      required: [response]
      properties:
        response: {type: string, minLength: 1, maxLength: 8192, description: Serialized WebAuthn credential JSON or an explicit single-use recovery code; never a TOTP}
    EnrollmentInput:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: {type: string, minLength: 1, maxLength: 1024}
    AuthOutcome:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [authenticated, passkey_required, enrollment_required]}
        public_key: {type: string, description: JSON-serialized WebAuthn creation or request options; ephemeral and realm-bound}
        recovery_codes:
          type: array
          items: {type: string}
          description: One-time enrollment response only
    Identity:
      type: object
      required: [user_id, realm, store_ids, grants]
      properties:
        user_id: {type: string, format: uuid}
        realm: {type: string, enum: [platform, tenant]}
        tenant_id: {type: string, format: uuid}
        store_ids:
          type: array
          items: {type: string, format: uuid}
        grants:
          type: array
          items: {$ref: '#/components/schemas/IdentityGrant'}
    IdentityGrant:
      type: object
      required: [role]
      properties:
        role: {type: string}
        store_id: {type: string, format: uuid}
        seller_code: {type: string}
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
